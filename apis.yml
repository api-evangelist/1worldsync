aid: 1worldsync
name: 1WorldSync
description: >-
  1WorldSync is the leading product content network and a GS1-certified GDSN data
  pool, helping consumer goods brands, manufacturers, and retailers create, manage,
  syndicate, and verify trusted product content across the digital shelf and the
  physical supply chain. Its Content1 platform exposes REST APIs for product master
  data — the Content1 Read API (product search, fetch, count, and hierarchy
  retrieval), the Item Management Inbound API (add, update, delete, and link items
  and hierarchies), a Digital Asset Management (DAM) API for images and rich media,
  and a User Management API (UMA) — all authenticated with HMAC-signed requests
  using an app_id and a secret key. 1WorldSync serves CPG, grocery, healthcare,
  foodservice, and DIY sectors and is SOC 2 Type 2 and ISO/IEC 27001:2022 certified.
